[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
thera-core = { path = "crates/core", default-features = false }
thera-capture = { path = "crates/capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

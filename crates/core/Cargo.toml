[package]
name = "thera-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable product core. Must never depend on tauri or any UI crate."

[features]
default = ["sqlcipher"]
# Production: SQLCipher-encrypted database. Needs a Windows-native perl (Strawberry) to build OpenSSL.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Dev-only fallback so the core compiles/tests without the OpenSSL toolchain. Encryption is NOT active.
plain-sqlite = ["rusqlite/bundled"]

# Test-only stand-in for whisper-cli (see tests/stt_sidecar.rs).
[[bin]]
name = "thera-fake-whisper"
path = "tests/support/fake_whisper.rs"
test = false
doc = false

# Test-only stand-in for the app's `--diarize` process (see tests/diarize_sidecar.rs).
[[bin]]
name = "thera-fake-diarize"
path = "tests/support/fake_diarize.rs"
test = false
doc = false

# Test-only stand-in for llama-server (see tests/llama_sidecar.rs).
[[bin]]
name = "thera-fake-llama"
path = "tests/support/fake_llama.rs"
test = false
doc = false

[dependencies]
rusqlite = { version = "0.37" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst = "0.15"
typst-pdf = "0.15"
docx-rs = "0.4"
regex = "1"
ureq = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
typst-render = "0.15"
typst-layout = "0.15"
thera-diarize.workspace = true

[dev-dependencies]
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# KBV Muster PTV 3 (4.2017): Bericht zum Fortführungsantrag.
# Bei mehreren Berichten zu Fortführungsanträgen sind die Berichte fortlaufend zu nummerieren.
key: ptv3-fortfuehrung
version: "2017.04"
title: Bericht an die Gutachterin / den Gutachter (Fortführungsantrag)
source: KBV Muster PTV 3 (4.2017)
report_kinds: [fortfuehrung]
rules:
  target_pages: 2
  keyword_style_allowed: true
  signature_required: true
  pseudonymized: true
  numbered: true
intro: >-
  Persönlich und in freier Form nach der vorgegebenen Gliederung erstellen, mit Datum und Unterschrift.
  Angaben können stichwortartig erfolgen. Umfang i.d.R. zwei Seiten. Berichte zu Fortführungsanträgen
  fortlaufend nummerieren.
sections:
  - key: verlauf
    number: "1"
    heading: >-
      Darstellung des bisherigen Behandlungsverlaufs seit dem letzten Bericht, der Veränderung der Symptomatik
      und des Behandlungsergebnisses in Bezug auf die Erreichung bzw. Nichterreichung der Therapieziele
    field: prose
    hints:
      - text: Auch bezüglich der begleitenden Behandlung der Bezugspersonen
        when: { age: [kjp] }
    # Bericht-Lotse (slice 38), see erst-umwandlung.yaml.
    asks:
      - key: verlauf
        question: Wie verlief die Behandlung seit dem letzten Bericht, was hat sich an der Symptomatik verändert?
      - key: zielerreichung
        question: Welche Therapieziele wurden erreicht, welche noch nicht?
      - key: bezugspersonen
        question: Wie verlief die begleitende Arbeit mit den Bezugspersonen?
        when: { age: [kjp] }

  - key: diagnose_befund
    number: "2"
    heading: >-
      Aktuelle Diagnose/n gemäß ICD-10 und aktueller psychischer Befund, weitere Ergebnisse
      psychodiagnostischer Testverfahren
    field: diagnoses
    ai_allowed: false
    hints:
      - text: ICD-10-Diagnose/n mit Angabe der Diagnosesicherheit
      - text: Aktueller psychischer Befund
      - text: Weitere Ergebnisse psychodiagnostischer Testverfahren

  - key: begruendung_planung
    number: "3"
    heading: >-
      Begründung der Notwendigkeit der Fortführung der Behandlung, weitere Therapieplanung, geänderte/erweiterte
      Behandlungsziele, geänderte Behandlungsmethoden und -techniken, Prognose, Planung des Therapieabschlusses,
      ggf. weiterführende Maßnahmen nach Ende der Therapie
    field: prose
    hints:
      - text: Begründung der Notwendigkeit der Fortführung der Behandlung
      - text: Weitere Therapieplanung, geänderte/erweiterte Behandlungsziele
      - text: Geänderte Behandlungsmethoden und -techniken
      - text: Prognose, Planung des Therapieabschlusses
      - text: Ggf. weiterführende Maßnahmen nach Ende der Therapie
    asks:
      - key: begruendung
        question: Warum ist die Fortführung der Behandlung notwendig?
      - key: planung
        question: Geänderte oder erweiterte Ziele, Methoden und Techniken?
        chips: [unverändert]
      - key: prognose
        question: Wie schätzen Sie die Prognose ein?
        chips: [günstig, eher günstig, eingeschränkt]
      - key: abschluss
        question: Wie planen Sie den Therapieabschluss, und was folgt danach?
        chips: [Ausschleichen der Frequenz, Rückfallprophylaxe]
